<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak COD Store - Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #2874f0; color: white; padding: 15px; text-align: center; }
        .banner { width: 100%; height: 300px; overflow: hidden; position: relative; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        .categories { text-align: center; padding: 15px; background: white; margin-bottom: 15px; }
        .cat-btn { padding: 10px 15px; margin: 5px; border: none; background: #ddd; cursor: pointer; border-radius: 5px; }
        .cat-btn.active { background: #2874f0; color: white; }
        
        .product-container { display: grid; gap: 15px; padding: 15px; max-width: 1200px; margin: auto; }
        .product-card { background: white; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s;}
        .product-card:hover { transform: scale(1.02); }
        .product-card img { width: 100%; height: 200px; object-fit: contain; }
        
        @media (min-width: 1024px) { .product-container { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 601px) and (max-width: 1023px) { .product-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .product-container { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px;} .product-card img { height: 150px; } }
        
        .load-more-container { text-align: center; margin: 20px 0; }
        .load-more-btn { background: #2874f0; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <header>
        <h2>Pak COD Store</h2>
    </header>

    <div class="banner">
        <img id="bannerImage" src="images/banner1.jpg" alt="Banner">
    </div>

    <div class="categories" id="category-container"></div>
    <div class="product-container" id="product-container"></div>

    <div class="load-more-container">
        <button id="loadMoreBtn" class="load-more-btn" onclick="loadMore()">Load More</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
