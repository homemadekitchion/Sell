<!DOCTYPE html>
<html lang="en-PK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Checkout - Pak COD Store</title>
    <meta name="description" content="View items in your shopping cart and place your Cash on Delivery order safely.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://aapki-website.github.io/cart.html">

    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f7f7; color: #222; }

        header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        header a { color: #000; text-decoration: none; font-weight: bold; font-size: 14px; }
        header h1 { margin: 0; font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; }

        .cart-page-wrapper { max-width: 900px; margin: 25px auto; padding: 15px; }
        .cart-grid { display: flex; flex-wrap: wrap; gap: 20px; }

        /* Left Column: Items List */
        .cart-items-card { flex: 1.4; min-width: 320px; background: #fff; border: 1px solid #e8e8e8; border-radius: 6px; padding: 20px; }
        .cart-items-card h2 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 8px; }

        .cart-row { display: flex; gap: 15px; padding: 14px 0; border-bottom: 1px solid #eee; align-items: center; }
        .cart-row img { width: 70px; height: 70px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; background: #fafafa; }
        .cart-row-info { flex: 1; }
        .cart-row-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .cart-row-specs { font-size: 12px; color: #a41c23; font-weight: 600; margin-bottom: 4px; }
        .cart-row-price { font-size: 14px; font-weight: 700; color: #111; }
        .qty-controls { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; }
        .qty-btn { background: #eee; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .qty-text { font-size: 13px; font-weight: bold; }
        .remove-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 20px; padding: 4px 8px; }
        .remove-btn:hover { color: #a41c23; }

        /* Right Column: Checkout Summary & COD Form */
        .checkout-summary-card { flex: 1; min-width: 300px; background: #fff; border: 1px solid #e8e8e8; border-radius: 6px; padding: 20px; height: fit-content; }
        .checkout-summary-card h2 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 8px; }

        .bill-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #555; }
        .bill-row.total { border-top: 1px dashed #ccc; padding-top: 12px; font-size: 18px; font-weight: 800; color: #000; }
        .bill-row.total span:last-child { color: green; }

        .cod-form { margin-top: 20px; }
        .cod-form input, .cod-form textarea { width: 100%; margin: 8px 0; padding: 11px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
        .confirm-order-btn { background: #004dd0; color: #fff; border: none; width: 100%; padding: 15px; font-size: 15px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-top: 8px; }
        .confirm-order-btn:hover { background: #003bb0; }

        .empty-cart-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 6px; border: 1px solid #eee; }
        .empty-cart-state span { font-size: 55px; display: block; margin-bottom: 12px; }
        .empty-cart-state h2 { margin: 0 0 8px 0; font-size: 20px; }
        .empty-cart-state p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .shop-now-btn { background: #000; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">&larr; Continue Shopping</a>
        <h1>Checkout</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="cart-page-wrapper">
        <div id="cartViewContainer">
            <!-- JavaScript will render either the cart grid or the empty state -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
