<!DOCTYPE html>
<html lang="en-PK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Arrivals - Pak COD Store</title>
    <meta name="description" content="Shop newly launched fashion, shoes, smartphones and watches with Cash on Delivery across Pakistan.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://aapki-website.github.io/new-arrivals.html">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #fff5f7; /* Soft aesthetic background like Image 3 */
            color: #222; 
        }

        /* Header */
        header { 
            background: #fff; 
            padding: 12px 18px; 
            border-bottom: 1px solid #f0e1e6; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .back-link { color: #000; text-decoration: none; font-weight: 700; font-size: 13px; }
        .header-title { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin: 0; }
        .header-title a { color: #000; text-decoration: none; }
        .cart-link-btn { background: #000; color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .cart-badge { background: #d81b60; color: #fff; border-radius: 50%; padding: 1px 6px; font-size: 10px; margin-left: 4px; }

        /* Retro/Pastel Promo Banner (Tasveer #3 Style) */
        .promo-hero-card {
            max-width: 1100px;
            margin: 25px auto 35px auto;
            background: #fce4ec;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            border: 2px solid #f8bbd0;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.08);
        }
        @media (max-width: 768px) {
            .promo-hero-card { flex-direction: column; text-align: center; padding: 20px; margin: 15px; }
        }

        .promo-frame {
            flex: 1;
            max-width: 380px;
            height: 280px;
            background: #fff;
            border-radius: 12px;
            border: 2px solid #222;
            box-shadow: 6px 6px 0px #222; /* Retro window shadow */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .promo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; }

        .promo-content { flex: 1.2; }
        .promo-pill { 
            background: #fff; 
            color: #d81b60; 
            font-size: 12px; 
            font-weight: 800; 
            padding: 6px 16px; 
            border-radius: 20px; 
            display: inline-block; 
            margin-bottom: 12px;
            border: 1px solid #f48fb1;
        }
        .promo-heading { 
            font-size: 38px; 
            font-weight: 900; 
            margin: 0 0 12px 0; 
            color: #1a1a1a; 
            letter-spacing: -1px;
            line-height: 1.1; 
        }
        .promo-desc { color: #555; font-size: 15px; line-height: 1.6; margin: 0 0 20px 0; }
        .promo-badge-tag {
            background: #222;
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Products Grid */
        .section-header { text-align: center; margin-bottom: 25px; }
        .section-header h2 { font-size: 24px; font-weight: 800; margin: 0; color: #111; }
        .section-header p { font-size: 13px; color: #777; margin: 6px 0 0 0; }

        .new-grid { 
            display: grid; 
            gap: 15px; 
            padding: 0 15px 50px 15px; 
            max-width: 1240px; 
            margin: auto; 
        }
        @media (min-width: 1024px) { .new-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
        @media (min-width: 601px) and (max-width: 1023px) { .new-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .new-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        /* Modern Aesthetic Card */
        .new-card { 
            background: #fff; 
            border: 1px solid #fce4ec; 
            border-radius: 12px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: transform 0.2s, box-shadow 0.2s; 
            position: relative;
        }
        .new-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(216, 27, 96, 0.12); }

        .new-tag { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: #d81b60; 
            color: #fff; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 3px 8px; 
            border-radius: 4px; 
            z-index: 5; 
        }

        .img-box { 
            position: relative; 
            background: #fafafa; 
            aspect-ratio: 1 / 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            cursor: pointer;
        }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; }

        .card-info { padding: 14px; }
        .rating-stars { color: #f59e0b; font-size: 13px; margin-bottom: 4px; }
        .card-title { font-size: 13px; font-weight: 600; color: #111; margin: 0 0 6px 0; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: pointer; }
        .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
        .price { font-size: 16px; font-weight: 800; color: #000; }
        .mrp { font-size: 12px; color: #999; text-decoration: line-through; }
        .disc { font-size: 11px; font-weight: 700; color: #d81b60; }

        .colors-strip { display: flex; gap: 4px; margin-bottom: 12px; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #ccc; background: #eee; }

        .card-actions { display: flex; gap: 6px; }
        .btn-buy { 
            flex: 1; 
            background: #d81b60; 
            color: #fff; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
        }
        .btn-cart { 
            background: #fff; 
            color: #111; 
            border: 1px solid #ccc; 
            padding: 10px 12px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
        }
        .btn-cart:hover { border-color: #000; }

        footer { background: #111; color: #aaa; text-align: center; padding: 25px 15px; font-size: 12px; }
        footer a { color: #fff; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <h1 class="header-title"><a href="index.html">PAK COD STORE</a></h1>
        <a href="cart.html" class="cart-link-btn">🛒 Cart <span id="cartCount" class="cart-badge">0</span></a>
    </header>

    <main>
        <!-- Retro-Pastel Hero Box (Image 3 Style) -->
        <section class="promo-hero-card">
            <div class="promo-frame">
                <img id="newHeroImg" src="" alt="New Arrival Featured">
            </div>
            <div class="promo-content">
                <span class="promo-pill" id="newHeroPill">Fresh Drops</span>
                <h1 class="promo-heading" id="newHeroTitle">New Arrival</h1>
                <p class="promo-desc" id="newHeroDesc">Discover newly curated trends for the season with nationwide Cash on Delivery.</p>
                <div class="promo-badge-tag">100% Cash on Delivery</div>
            </div>
        </section>

        <!-- Product Listing Grid -->
        <div class="section-header">
            <h2>Latest Arrivals</h2>
            <p>Fresh inventory checked and ready to dispatch</p>
        </div>

        <section class="new-grid" id="newArrivalsGrid" aria-label="New Arrivals Products"></section>
    </main>

    <footer>
        <p>&copy; 2026 Pak COD Store. All rights reserved. | <a href="index.html">Home</a> | <a href="cart.html">View Cart</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
