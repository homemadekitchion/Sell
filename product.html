<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #2874f0; color: white; padding: 15px; text-align: center; position: relative;}
        .back-btn { position: absolute; left: 15px; top: 15px; background: white; color: #2874f0; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-weight: bold;}
        
        .detail-container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        
        /* Image Slider */
        .slider { position: relative; width: 100%; height: 350px; text-align: center; background: #fff; display: flex; align-items: center; justify-content: center;}
        .slider img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .prev, .next { cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%); padding: 10px 15px; background: rgba(0,0,0,0.5); color: white; font-weight: bold; font-size: 18px; border: none; border-radius: 3px; }
        .prev { left: 10px; }
        .next { right: 10px; }
        .prev:hover, .next:hover { background: rgba(0,0,0,0.8); }

        .details h2 { margin-top: 20px; }
        .price { color: green; font-size: 24px; font-weight: bold; }
        .desc { color: #555; line-height: 1.6; margin-bottom: 20px;}
        .buy-btn { background: #ff9f00; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 5px; font-size: 18px; font-weight: bold; }

        /* Order Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; padding: 20px; width: 90%; max-width: 400px; margin: 10% auto; border-radius: 8px; }
        .modal input, .modal textarea { width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        .confirm-btn { background: green; color: white; padding: 10px; width: 100%; border: none; cursor: pointer; font-size: 16px;}
        .close-btn { background: red; color: white; padding: 5px 10px; border: none; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">&larr; Back</a>
        <h2>Product Details</h2>
    </header>

    <div class="detail-container">
        <!-- Slider -->
        <div class="slider">
            <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
            <img id="mainProductImage" src="" alt="Product">
            <button class="next" onclick="changeSlide(1)">&#10095;</button>
        </div>

        <!-- Details -->
        <div class="details">
            <h2 id="prodTitle">Loading...</h2>
            <p class="price" id="prodPrice"></p>
            <p class="desc" id="prodDesc"></p>
            <button class="buy-btn" onclick="openModal()">Buy Now (Cash on Delivery)</button>
        </div>
    </div>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            <h3>Order Details</h3>
            <p id="orderItemName" style="font-weight:bold;"></p>
            
            <input type="text" id="custName" placeholder="Aapka Mukammal Naam" required>
            <input type="text" id="custPhone" placeholder="Mobile Number (03XXXXXXXXX)" required>
            <textarea id="custAddress" placeholder="Mukammal Delivery Address" rows="3" required></textarea>
            
            <button class="confirm-btn" onclick="submitOrder()">Confirm Order via WhatsApp</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
